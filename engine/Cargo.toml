[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Equid cost-field engine: edge features x weights x time of day, builds native and wasm32"

[lib]
# cdylib = the .wasm for the browser, rlib = native tests / future server
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# pinned to the installed wasm-bindgen CLI (0.2.117): crate and CLI versions must match exactly
wasm-bindgen = "=0.2.117"
petgraph = { version = "0.8", default-features = false }
